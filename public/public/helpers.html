<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helpers - TMS</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="dashboard-body">

    <nav class="navbar">

        <div class="logo">
            TMS
        </div>

        <div class="nav-right">

            <a href="/dashboard.html" class="nav-link">
                Dashboard
            </a>

            <a href="/company.html" class="nav-link">
                Companies
            </a>

            <a href="/profile.html" class="nav-link">
                Profile
            </a>

            <button onclick="logout()" class="logout-btn">
                Logout
            </button>

        </div>

    </nav>

    <div class="dashboard-container">

        <div class="dashboard-header">

            <div>
                <h1>Helpers</h1>
                <p>Helper Management</p>
            </div>

        </div>

        <div class="vehicle-form" id="helperForm">

            <div class="form-group">

                <label for="name">
                    Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter helper name"
                >

            </div>

            <div class="form-group">

                <label for="mobile">
                    Mobile
                </label>

                <input
                    type="text"
                    id="mobile"
                    placeholder="Enter mobile number"
                >

            </div>

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter email"
                >

            </div>

            <div class="form-group">

                <label for="address">
                    Address
                </label>

                <input
                    type="text"
                    id="address"
                    placeholder="Enter address"
                >

            </div>

            <div class="form-group">

                <label for="status">
                    Status
                </label>

                <select id="status">

                    <option value="1">
                        Active
                    </option>

                    <option value="0">
                        Inactive
                    </option>

                </select>

            </div>

            <button
                type="button"
                id="saveHelper"
                onclick="addHelper()"
            >
                Save Helper
            </button>

        </div>

        <div id="helperMessage"></div>

        <div class="module-card">

            <div class="module-card-header">

                <h2>
                    Helpers
                </h2>

                <span id="helperCount">
                    0 Helpers
                </span>

            </div>

            <div class="table-wrapper">

                <table class="module-table">

                    <thead>

                        <tr>
                            <th>ID</th>
                            <th>Company ID</th>
                            <th>Name</th>
                            <th>Mobile</th>
                            <th>Email</th>
                            <th>Address</th>
                            <th>Status</th>
                            <th>Created At</th>
                            <th>Updated At</th>
                        </tr>

                    </thead>

                    <tbody id="helperList">

                    </tbody>

                </table>

            </div>

            <div
                id="emptyHelpers"
                class="empty-records"
                style="display: none;"
            >
                No helpers found
            </div>

        </div>

    </div>

    <script src="script.js"></script>
    <script src="helpers.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TMS Companies</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body class="dashboard-body">

    <nav class="navbar">

        <div class="logo">
            TMS
        </div>

        <div class="nav-right">

            <a
                href="/dashboard.html"
                class="nav-link"
            >
                Dashboard
            </a>

            <a
                href="/company.html"
                class="nav-link active"
            >
                Companies
            </a>

            <a
                href="/profile.html"
                class="nav-link"
            >
                Profile
            </a>

            <button
                onclick="logout()"
                class="logout-btn"
            >
                Logout
            </button>

        </div>

    </nav>


    <div class="company-page">

        <div class="company-top">

            <div>

                <h1>
                    Companies
                </h1>

                <p>
                    Manage companies
                </p>

            </div>

            <button
                type="button"
                id="addCompanyButton"
                class="add-company-btn"
            >
                + Add Company
            </button>

        </div>


        <div
            id="companyMessage"
            class="company-message"
        ></div>


        <div
            id="companyFormCard"
            class="company-form-card"
        >

            <h2 id="companyFormTitle">
                Add Company
            </h2>

            <form id="companyForm">

                <input
                    type="hidden"
                    id="companyId"
                >

                <div class="form-group">

                    <label for="companyName">
                        Company Name
                    </label>

                    <input
                        type="text"
                        id="companyName"
                        placeholder="Enter company name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="companyStatus">
                        Status
                    </label>

                    <select id="companyStatus">

                        <option value="1">
                            Active
                        </option>

                        <option value="0">
                            Inactive
                        </option>

                    </select>

                </div>


                <div class="company-form-buttons">

                    <button
                        type="submit"
                        id="saveCompanyButton"
                        class="save-company-btn"
                    >
                        Create Company
                    </button>

                    <button
                        type="button"
                        id="cancelCompanyButton"
                        class="cancel-company-btn"
                    >
                        Cancel
                    </button>

                </div>

            </form>

        </div>


        <div class="company-table-card">

            <div class="company-table-header">

                <h2>
                    Company List
                </h2>

                <span id="companyCount">
                    0 Companies
                </span>

            </div>


            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th>
                                ID
                            </th>

                            <th>
                                Company Name
                            </th>

                            <th>
                                Status
                            </th>

                            <th>
                                Created
                            </th>

                            <th>
                                Updated
                            </th>

                            <th>
                                Actions
                            </th>

                        </tr>

                    </thead>

                    <tbody id="companyTableBody">

                    </tbody>

                </table>

            </div>


            <div
                id="emptyCompany"
                class="empty-company"
            >
                No companies found
            </div>

        </div>

    </div>


    <script src="script.js"></script>

    <script src="company.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trips - TMS</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="dashboard-body">

    <nav class="navbar">

        <div class="logo">
            TMS
        </div>

        <div class="nav-right">

            <a href="/dashboard.html" class="nav-link">
                Dashboard
            </a>

            <a href="/company.html" class="nav-link">
                Companies
            </a>

            <a href="/profile.html" class="nav-link">
                Profile
            </a>

            <button onclick="logout()" class="logout-btn">
                Logout
            </button>

        </div>

    </nav>

    <div class="dashboard-container">

        <div class="dashboard-header">

            <div>
                <h1>Trips</h1>
                <p>Trip Management</p>
            </div>

        </div>

        <div class="vehicle-form">

            <div class="form-group">

                <label for="vehicle_id">
                    Vehicle ID
                </label>

                <input
                    type="number"
                    id="vehicle_id"
                    placeholder="Enter vehicle ID"
                >

            </div>

            <div class="form-group">

                <label for="driver_id">
                    Driver ID
                </label>

                <input
                    type="number"
                    id="driver_id"
                    placeholder="Enter driver ID"
                >

            </div>

            <div class="form-group">

                <label for="helper_id">
                    Helper ID
                </label>

                <input
                    type="number"
                    id="helper_id"
                    placeholder="Enter helper ID"
                >

            </div>

            <div class="form-group">

                <label for="bilty_id">
                    Bilty ID
                </label>

                <input
                    type="number"
                    id="bilty_id"
                    placeholder="Enter bilty ID"
                >

            </div>

            <div class="form-group">

                <label for="client_id">
                    Client ID
                </label>

                <input
                    type="number"
                    id="client_id"
                    placeholder="Enter client ID"
                >

            </div>

            <div class="form-group">

                <label for="source">
                    Source
                </label>

                <input
                    type="text"
                    id="source"
                    placeholder="Enter source"
                >

            </div>

            <div class="form-group">

                <label for="destination">
                    Destination
                </label>

                <input
                    type="text"
                    id="destination"
                    placeholder="Enter destination"
                >

            </div>

            <div class="form-group">

                <label for="start_date">
                    Start Date
                </label>

                <input
                    type="datetime-local"
                    id="start_date"
                >

            </div>

            <div class="form-group">

                <label for="end_date">
                    End Date
                </label>

                <input
                    type="datetime-local"
                    id="end_date"
                >

            </div>

            <div class="form-group">

                <label for="status">
                    Status
                </label>

                <select id="status">

                    <option value="PLANNED">
                        Planned
                    </option>

                    <option value="ASSIGNED">
                        Assigned
                    </option>

                    <option value="IN_TRANSIT">
                        In Transit
                    </option>

                    <option value="COMPLETED">
                        Completed
                    </option>

                    <option value="CANCELLED">
                        Cancelled
                    </option>

                </select>

            </div>

            <button
                type="button"
                id="saveTrip"
                onclick="addTrip()"
            >
                Save Trip
            </button>

        </div>

        <div id="tripMessage"></div>

        <div class="module-card">

            <div class="module-card-header">

                <h2>
                    Trips
                </h2>

                <span id="tripCount">
                    0 Trips
                </span>

            </div>

            <div class="table-wrapper">

                <table class="module-table">

                    <thead>

                        <tr>
                            <th>ID</th>
                            <th>Company ID</th>
                            <th>Vehicle ID</th>
                            <th>Driver ID</th>
                            <th>Helper ID</th>
                            <th>Bilty ID</th>
                            <th>Client ID</th>
                            <th>Source</th>
                            <th>Destination</th>
                            <th>Start Date</th>
                            <th>End Date</th>
                            <th>Status</th>
                            <th>Created At</th>
                            <th>Updated At</th>
                        </tr>

                    </thead>

                    <tbody id="tripList">

                    </tbody>

                </table>

            </div>

            <div
                id="emptyTrips"
                class="empty-records"
                style="display: none;"
            >
                No trips found
            </div>

        </div>

    </div>

    <script src="script.js"></script>
    <script src="trips.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TMS Profile</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body class="dashboard-body">

    <nav class="navbar">

        <div class="logo">
            TMS
        </div>

        <div class="nav-right">

            <a
                href="/dashboard.html"
                class="nav-link"
            >
                Dashboard
            </a>

            <a
                href="/profile.html"
                class="nav-link active"
            >
                Profile
            </a>

            <button
                onclick="logout()"
                class="logout-btn"
            >
                Logout
            </button>

        </div>

    </nav>


    <div class="profile-container">

        <div class="profile-card">

            <div class="profile-header">

                <div class="profile-icon">
                    👤
                </div>

                <div>

                    <h1>
                        My Profile
                    </h1>

                    <p>
                        Manage your account details
                    </p>

                </div>

            </div>


            <form id="profileForm">

                <div class="form-group">

                    <label for="profileName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="profileName"
                        placeholder="Enter your name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="profileEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="profileEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="profileMobile">
                        Mobile Number
                    </label>

                    <input
                        type="text"
                        id="profileMobile"
                        placeholder="Enter mobile number"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="profileUserType">
                        Account Type
                    </label>

                    <input
                        type="text"
                        id="profileUserType"
                        readonly
                    >

                </div>


                <div class="form-group">

                    <label for="profileStatus">
                        Account Status
                    </label>

                    <input
                        type="text"
                        id="profileStatus"
                        readonly
                    >

                </div>


                <div
                    id="profileMessage"
                    class="profile-message"
                ></div>


                <button
                    type="submit"
                    id="updateProfileButton"
                    class="update-btn"
                >
                    Update Profile
                </button>

            </form>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TMS Login</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body class="auth-body">

    <div class="container">

        <div class="box">

            <h1>TMS</h1>

            <p class="subtitle">
                Transport Management System
            </p>

            <h2>
                Login
            </h2>

            <form id="loginForm">

                <label for="loginEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    required
                >

                <label for="loginPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>

            <p
                id="loginMessage"
                class="form-message"
            ></p>

            <div class="link">

                Don't have an account?

                <a href="/register.html">
                    Register
                </a>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicles - TMS</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="dashboard-body">

    <nav class="navbar">

        <div class="logo">
            TMS
        </div>

        <div class="nav-right">

            <a href="/dashboard.html" class="nav-link">
                Dashboard
            </a>

            <a href="/company.html" class="nav-link">
                Companies
            </a>

            <a href="/profile.html" class="nav-link">
                Profile
            </a>

            <button onclick="logout()" class="logout-btn">
                Logout
            </button>

        </div>

    </nav>

    <div class="dashboard-container">

        <div class="dashboard-header">

            <div>
                <h1>Vehicles</h1>
                <p>Vehicle Management</p>
            </div>

        </div>

        <div class="vehicle-form" id="vehicleForm">

            <div class="form-group">

                <label for="vehicle_type_id">
                    Vehicle Type ID
                </label>

                <select id="vehicle_type_id">
    <option value="">Select Vehicle Type</option>
    <option value="1">Truck</option>
    <option value="2">Trailer</option>
    <option value="3">Container</option>
</select>

            </div>

            <div class="form-group">

                <label for="registration_no">
                    Registration Number
                </label>

                <input
                    type="text"
                    id="registration_no"
                    placeholder="Enter registration number"
                >

            </div>

            <div class="form-group">

                <label for="capacity">
                    Capacity
                </label>

                <input
                    type="number"
                    step="0.01"
                    id="capacity"
                    placeholder="Enter capacity"
                >

            </div>

            <div class="form-group">

                <label for="status">
                    Status
                </label>

                <select id="status">

                    <option value="1">
                        Active
                    </option>

                    <option value="0">
                        Inactive
                    </option>

                </select>

            </div>

            <button
                type="button"
                id="saveVehicle"
                onclick="addVehicle()"
            >
                Save Vehicle
            </button>

        </div>

        <div id="vehicleMessage"></div>

        <div class="module-card">

            <div class="module-card-header">

                <h2>
                    Vehicles
                </h2>

                <span id="vehicleCount">
                    0 Vehicles
                </span>

            </div>

            <div class="table-wrapper">

                <table class="module-table">

                    <thead>

                        <tr>
                            <th>ID</th>
                            <th>Company ID</th>
                            <th>Vehicle Type ID</th>
                            <th>Registration Number</th>
                            <th>Capacity</th>
                            <th>Status</th>
                            <th>Created At</th>
                            <th>Updated At</th>
                        </tr>

                    </thead>

                    <tbody id="vehicleList">

                    </tbody>

                </table>

            </div>

            <div
                id="emptyVehicles"
                class="empty-records"
                style="display: none;"
            >
                No vehicles found
            </div>

        </div>

    </div>

    <script src="script.js"></script>
    <script src="vehicles.js"></script>

</body>

</html>

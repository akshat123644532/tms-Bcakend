<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilties - TMS</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="dashboard-body">

    <nav class="navbar">

        <div class="logo">
            TMS
        </div>

        <div class="nav-right">

            <a href="/dashboard.html" class="nav-link">
                Dashboard
            </a>

            <a href="/company.html" class="nav-link">
                Companies
            </a>

            <a href="/profile.html" class="nav-link">
                Profile
            </a>

            <button onclick="logout()" class="logout-btn">
                Logout
            </button>

        </div>

    </nav>

    <div class="dashboard-container">

        <div class="dashboard-header">

            <div>
                <h1>Bilties</h1>
                <p>Bilty Management</p>
            </div>

        </div>

        <div class="vehicle-form">

            <div class="form-group">

                <label for="bilty_number">
                    Bilty Number
                </label>

                <input
                    type="text"
                    id="bilty_number"
                    placeholder="Enter bilty number"
                >

            </div>

            <div class="form-group">

                <label for="client_id">
                    Client ID
                </label>

                <input
                    type="number"
                    id="client_id"
                    placeholder="Enter client ID"
                >

            </div>

            <div class="form-group">

                <label for="trip_id">
                    Trip ID
                </label>

                <input
                    type="number"
                    id="trip_id"
                    placeholder="Enter trip ID"
                >

            </div>

            <div class="form-group">

                <label for="status">
                    Status
                </label>

                <select id="status">

                    <option value="RESERVED">
                        Reserved
                    </option>

                    <option value="CREATED">
                        Created
                    </option>

                    <option value="CANCELLED">
                        Cancelled
                    </option>

                    <option value="COMPLETED">
                        Completed
                    </option>

                </select>

            </div>

            <button
                type="button"
                id="saveBilty"
                onclick="addBilty()"
            >
                Save Bilty
            </button>

        </div>

        <div id="biltyMessage"></div>

        <div class="module-card">

            <div class="module-card-header">

                <h2>
                    Bilties
                </h2>

                <span id="biltyCount">
                    0 Bilties
                </span>

            </div>

            <div class="table-wrapper">

                <table class="module-table">

                    <thead>

                        <tr>
                            <th>ID</th>
                            <th>Company ID</th>
                            <th>Bilty Number</th>
                            <th>Client ID</th>
                            <th>Status</th>
                            <th>Trip ID</th>
                            <th>Created At</th>
                            <th>Updated At</th>
                        </tr>

                    </thead>

                    <tbody id="biltyList"></tbody>

                </table>

            </div>

            <div
                id="emptyBilties"
                class="empty-records"
                style="display: none;"
            >
                No bilties found
            </div>

        </div>

    </div>

    <script src="script.js"></script>
    <script src="bilties.js"></script>

</body>

</html>
